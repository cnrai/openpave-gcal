# OpenPAVE Google Calendar Skill
# Read and manage Google Calendar events securely using OAuth

name: gcal
version: 1.3.6
description: Read and manage Google Calendar events securely using OAuth

author:
  name: cnrai
  url: https://github.com/cnrai/openpave-gcal

license: MIT
homepage: https://github.com/cnrai/openpave-gcal
repository: cnrai/openpave-gcal

# Execution pattern
pattern: sandbox
entrypoint: index.js

usage_notes: |
  IMPORTANT FOR AI AGENTS:
  
  Calendar Invite Rules (CRITICAL):
  - ALWAYS check today's date before setting any date from a relative reference ("tomorrow", "next Monday", etc.)
  - NEVER create a calendar event without confirmation first — present the full details (title, date, time, attendees, agenda) and wait for explicit approval before calling create
  - Google Calendar has NO draft mode — once created, invites are sent immediately to all attendees
  - There is no undo — deleting an event still sends a cancellation notice
  
  Date Handling:
  - Always use absolute dates, never relative terms in the API call
  - Verify timezone — default to the user's local timezone
  - For all-day events, use date-only format (no time component)
  - Include --reminder when creating events that need preparation
  
  Event Display:
  - When showing today's events, skip daily recurring events (e.g., "Daily briefing")
  - Only highlight one-off meetings and non-daily recurring events
  - Show event duration and attendee count in summaries

# Available commands
commands:
  - name: auth
    description: Show authentication status
    options:
      - --summary

  - name: calendars
    description: List all calendars
    options:
      - --max <number>
      - --summary

  - name: today
    description: Show today's events
    options:
      - -c, --calendar <id>
      - -n, --max <count>
      - --summary
      - --full

  - name: upcoming
    description: Show upcoming events (default 7 days)
    args:
      - "[days]"
    options:
      - -c, --calendar <id>
      - -n, --max <count>
      - -d, --days <number>
      - --summary
      - --full

  - name: list
    description: List events (optionally from specific calendar)
    args:
      - "[calendar]"
    options:
      - -c, --calendar <id>
      - -n, --max <count>
      - --summary
      - --full

  - name: search
    description: Search events
    args:
      - <query>
    options:
      - -c, --calendar <id>
      - -n, --max <count>
      - -f, --from <date>
      - -t, --to <date>
      - --summary
      - --full

  - name: event
    description: Get specific event details
    args:
      - <eventId>
    options:
      - -c, --calendar <id>
      - --summary

  - name: create
    description: Create a new calendar event
    aliases:
      - add
    options:
      - --title <title>
      - --description, --desc <desc>
      - --location <location>
      - --start <datetime>
      - --end <datetime>
      - --timezone <zone>
      - --attendees <emails>
      - --reminder <minutes>
      - -c, --calendar <id>

  - name: update
    description: Update an existing calendar event
    aliases:
      - edit
    args:
      - <eventId>
    options:
      - --title <title>
      - --description, --desc <desc>
      - --location <location>
      - --start <datetime>
      - --end <datetime>
      - --timezone <zone>
      - --attendees <emails>
      - -c, --calendar <id>

  - name: delete
    description: Delete a calendar event
    aliases:
      - remove
    args:
      - <eventId>
    options:
      - -c, --calendar <id>
      - --yes, -y

# Token configuration for secure sandbox access
tokens:
  google-calendar:
    type: oauth
    description: Google Calendar API OAuth credentials
    domains:
      - www.googleapis.com
      - "*.googleapis.com"
    env:
      required:
        - GOOGLE_CALENDAR_CLIENT_ID
        - GOOGLE_CALENDAR_CLIENT_SECRET
        - GOOGLE_CALENDAR_REFRESH_TOKEN
      optional:
        - GOOGLE_CALENDAR_ACCESS_TOKEN
    # OAuth authorization flow configuration (for web UI authentication)
    oauth:
      provider: google
      authorizeUrl: https://accounts.google.com/o/oauth2/v2/auth
      scopes:
        - https://www.googleapis.com/auth/calendar.readonly
        - https://www.googleapis.com/auth/calendar.events
    config:
      env: GOOGLE_CALENDAR_ACCESS_TOKEN
      type: oauth
      domains:
        - www.googleapis.com
        - "*.googleapis.com"
      placement:
        type: header
        name: Authorization
        format: "Bearer {token}"
      refreshEnv: GOOGLE_CALENDAR_REFRESH_TOKEN
      refreshUrl: https://oauth2.googleapis.com/token
      clientIdEnv: GOOGLE_CALENDAR_CLIENT_ID
      clientSecretEnv: GOOGLE_CALENDAR_CLIENT_SECRET

# Sandbox permissions
permissions:
  fs.read: []
  fs.write: []
  network:
    - www.googleapis.com
    - oauth2.googleapis.com
  modules:
    - fs
    - path
  system: []

# Platform compatibility
platforms:
  - darwin
  - linux
  - win32

engines:
  node: ">=16.0.0"

# Metadata
keywords:
  - calendar
  - google
  - oauth
  - events
  - scheduling
  - appointments
  - event-creation
  - event-management

category: productivity
icon: "📅"
